services:
  mysql:
    image: mysql:8.0
    container_name: au-agent-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: au_agent
      MYSQL_USER: au_agent
      MYSQL_PASSWORD: au_agent
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
