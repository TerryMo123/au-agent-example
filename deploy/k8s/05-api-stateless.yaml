# 无状态 API（需配合 10-chroma.yaml + ConfigMap VECTOR_BACKEND=http）
# 用法：先 apply 10-chroma.yaml，再 apply 本文件（或替换 05-api.yaml）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: au-agent-api
  namespace: au-agent
  labels:
    app: au-agent-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: au-agent-api
  template:
    metadata:
      labels:
        app: au-agent-api
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/au-agent-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: au-agent-config
            - secretRef:
                name: au-agent-secret
          env:
            - name: VECTOR_BACKEND
              value: "http"
            - name: CHROMA_HOST
              value: "au-agent-chroma"
            - name: CHROMA_PORT
              value: "8000"
            - name: CHROMA_SSL
              value: "false"
          # 无状态：不再挂本地 chroma PVC
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: au-agent-api
  namespace: au-agent
  labels:
    app: au-agent-api
spec:
  type: ClusterIP
  selector:
    app: au-agent-api
  ports:
    - name: http
      port: 8000
      targetPort: http
