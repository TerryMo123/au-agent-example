# 独立 Chroma Server：API 设 VECTOR_BACKEND=http 后可不挂本地 PVC，支持多副本
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: au-agent-chroma-server
  namespace: au-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: au-agent-chroma
  namespace: au-agent
  labels:
    app: au-agent-chroma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: au-agent-chroma
  template:
    metadata:
      labels:
        app: au-agent-chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:0.5.23
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: au-agent-chroma-server
---
apiVersion: v1
kind: Service
metadata:
  name: au-agent-chroma
  namespace: au-agent
spec:
  selector:
    app: au-agent-chroma
  ports:
    - name: http
      port: 8000
      targetPort: http
