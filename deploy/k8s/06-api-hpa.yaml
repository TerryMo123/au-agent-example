# 仅当 Chroma 使用 RWX（或改为无状态/外部向量库）后启用 HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: au-agent-api
  namespace: au-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: au-agent-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
