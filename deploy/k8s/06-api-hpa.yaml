# 仅当 API 无状态（VECTOR_BACKEND=http + 05-api-stateless）或 Chroma 使用 RWX 后启用
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: au-agent-api
  namespace: au-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: au-agent-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
