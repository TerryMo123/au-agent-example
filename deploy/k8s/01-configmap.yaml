apiVersion: v1
kind: ConfigMap
metadata:
  name: au-agent-config
  namespace: au-agent
data:
  APP_NAME: "傲基智能数据问答 Agent"
  APP_ENV: "production"
  DEBUG: "false"
  OPENAI_MODEL: "qwen-max"
  OPENAI_ROUTER_MODEL: "qwen-turbo"
  OPENAI_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  OPENAI_EMBEDDING_MODEL: "text-embedding-v3"
  MYSQL_HOST: "YOUR_MYSQL_HOST"
  MYSQL_PORT: "3306"
  MYSQL_USER: "au_agent"
  MYSQL_DATABASE: "au_agent"
  CHROMA_PERSIST_DIR: "/app/data/chroma"
  CHROMA_COLLECTION_NAME: "au_internal_docs"
  AGENT_MAX_ITERATIONS: "10"
  SESSION_HISTORY_LIMIT: "20"
  LLM_MAX_RETRIES: "3"
  LLM_RETRY_BACKOFF_SECONDS: "0.8"
  SEMANTIC_CACHE_ENABLED: "true"
  REDIS_URL: "redis://au-agent-redis:6379/0"
  SEMANTIC_CACHE_TTL_SECONDS: "3600"
  SEMANTIC_CACHE_THRESHOLD: "0.92"
  SEMANTIC_CACHE_MAX_ENTRIES: "500"
