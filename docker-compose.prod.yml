# 生产向 Docker Compose：API + Web + Redis（不占宿主机 80）
# 对外入口见同级目录 moyong-gateway
# MySQL 使用外部实例；用法见 deploy/README.md

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  au-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: au-agent-api:latest
    container_name: au-agent-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      - redis
    expose:
      - "8000"
    networks:
      - default
      - edge

  au-agent-web:
    build:
      context: ../au-agent-web-example
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /au/
        VITE_BAIDU_TONGJI_ID: ${VITE_BAIDU_TONGJI_ID:-0c9d8aab323d726a31b6d312bdcf58a9}
    image: au-agent-web:latest
    container_name: au-agent-web
    restart: unless-stopped
    depends_on:
      au-agent-api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - edge

volumes:
  redis_data:
  chroma_data:

networks:
  edge:
    external: true
    name: moyong-edge
