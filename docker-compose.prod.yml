# 生产向 Docker Compose：API + Web + Redis
# MySQL 默认使用外部实例（与现网一致）；也可取消注释本地 mysql。
# 用法见 deploy/README.md

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  au-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: au-agent-api:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      - redis
    expose:
      - "8000"
    # 本机调试可打开: "8000:8000"
    # ports:
    #   - "8000:8000"

  au-agent-web:
    build:
      context: ../au-agent-web-example
      dockerfile: Dockerfile
      args:
        # 构建时传入百度统计 ID（也可在服务器 export 后 build）
        VITE_BAIDU_TONGJI_ID: ${VITE_BAIDU_TONGJI_ID:-0c9d8aab323d726a31b6d312bdcf58a9}
    image: au-agent-web:latest
    restart: unless-stopped
    depends_on:
      au-agent-api:
        condition: service_healthy
    ports:
      - "80:80"
      # 启用 HTTPS 后取消下一行注释，并改用 nginx-web-ssl.conf（见 deploy/certs/README.md）
      # - "443:443"
    volumes:
      - ./deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS：
      # - ./deploy/nginx-web-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
      # - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/www:/var/www/certbot:ro

volumes:
  redis_data:
  chroma_data:
